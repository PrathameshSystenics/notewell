<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages serves this page for any missing path; resolve assets from the site root. -->
  <base href="/notewell/">
  <title>Page not found · Notewell</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="application-name" content="Notewell">
  <meta name="apple-mobile-web-app-title" content="Notewell">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-base-200 text-base-content min-h-screen">
  <div id="page" hidden class="min-h-screen flex flex-col">
    <div data-public-header></div>
    <div class="flex-1 grid place-items-center px-4 py-12 md:py-16">
      <div class="w-full max-w-md text-center">
        <p class="mono text-sm opacity-50">404</p>
        <h1 class="text-xl font-semibold tracking-tight mt-2">We couldn't find that page</h1>
        <p class="text-sm opacity-60 mt-2">The link may be broken, or the page may have moved.</p>
        <div class="flex justify-center gap-2 mt-6" id="actions"></div>
      </div>
    </div>
    <div data-footer-slot></div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async () => {
      const user = await UI.bootPublic();
      document.getElementById('actions').innerHTML = user
        ? `<a class="btn btn-sm btn-primary" href="${Auth.homeFor(user)}">Go to my notes</a>`
        : '<a class="btn btn-sm btn-primary" href="index.html">Go to the home page</a>';
    })();
  </script>
</body>
</html>
