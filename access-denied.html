<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied · Notewell</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-base-200 text-base-content min-h-screen">
  <div id="page" hidden class="min-h-screen flex flex-col">
    <div data-public-header></div>
    <div class="flex-1 grid place-items-center px-4 py-12 md:py-16">
      <div class="w-full max-w-md text-center">
        <p class="mono text-sm opacity-50">403</p>
        <h1 class="text-xl font-semibold tracking-tight mt-2">You don't have access to this page</h1>
        <p class="text-sm opacity-60 mt-2" id="reason">Your account does not have the role this page requires.</p>
        <div class="flex justify-center gap-2 mt-6" id="actions"></div>
      </div>
    </div>
    <div data-footer-slot></div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async () => {
      const user = await UI.bootPublic();
      const actions = document.getElementById('actions');
      if (user) {
        if (!user.roles.length) {
          document.getElementById('reason').textContent =
            'Your account currently has no active role. Ask an administrator to restore access.';
        }
        actions.innerHTML = `<a class="btn btn-sm btn-primary" href="${Auth.homeFor(user)}">Go to my home page</a>
          <button class="btn btn-sm btn-ghost" id="switch">Sign in as someone else</button>`;
        document.getElementById('switch').onclick = () => {
          Auth.logout();
          location.href = 'login.html';
        };
      } else {
        actions.innerHTML = '<a class="btn btn-sm btn-primary" href="login.html">Sign in</a>';
      }
    })();
  </script>
</body>
</html>
