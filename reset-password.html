<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Notewell</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="application-name" content="Notewell">
  <meta name="apple-mobile-web-app-title" content="Notewell">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-base-200 text-base-content min-h-screen">
  <div id="page" hidden class="min-h-screen flex flex-col">
    <div data-public-header></div>
    <div class="flex-1 grid place-items-center px-4 py-12 md:py-16">
      <div class="w-full max-w-sm">
        <div id="invalid" hidden class="bg-base-100 border hairline rounded-box p-6 text-center">
          <h1 class="text-lg font-semibold">This link has expired</h1>
          <p class="text-sm opacity-70 mt-2">Reset links work once and expire after an hour. You can ask for a new one.</p>
          <a href="forgot-password.html" class="btn btn-primary btn-sm mt-5">Get a new link</a>
        </div>

        <div id="reset" hidden>
          <div class="mb-8">
            <h1 class="text-xl font-semibold tracking-tight">Choose a new password</h1>
            <p class="text-sm opacity-60 mt-1">You'll be signed out on any other devices.</p>
          </div>
          <form id="reset-form" class="bg-base-100 border hairline rounded-box p-6 space-y-4" novalidate>
            <div id="form-error" class="text-sm text-error" role="alert" hidden></div>
            <div>
              <label class="block text-sm mb-1.5" for="newPassword">New password</label>
              <input id="newPassword" name="newPassword" type="password" class="input w-full" autocomplete="new-password" autofocus>
              <ul id="rules" class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs mt-2"></ul>
              <p class="text-error text-xs mt-1.5" data-error-for="newPassword"></p>
            </div>
            <div>
              <label class="block text-sm mb-1.5" for="confirmPassword">Confirm new password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" class="input w-full" autocomplete="new-password">
              <p class="text-error text-xs mt-1.5" data-error-for="confirmPassword"></p>
            </div>
            <button class="btn btn-primary w-full" type="submit">Save new password</button>
          </form>
        </div>
      </div>
    </div>
    <div data-footer-slot></div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async () => {
      await UI.bootPublic();
      const token = UI.params().token || '';
      // Keep the token out of the address bar and browser history.
      history.replaceState(null, '', location.pathname);
      if (!(await Auth.resetTokenValid(token))) {
        document.getElementById('invalid').hidden = false;
        return;
      }
      document.getElementById('reset').hidden = false;
      const form = document.getElementById('reset-form');
      const rules = document.getElementById('rules');
      const errorBox = document.getElementById('form-error');
      function renderRules() {
        const p = form.elements.newPassword.value;
        rules.innerHTML = Auth.passwordRules
          .map((r) => `<li class="flex items-center gap-1.5 ${r.test(p) ? '' : 'opacity-50'}">${UI.icon(r.test(p) ? 'check' : 'x', 'size-3')}${r.label}</li>`)
          .join('');
      }
      form.elements.newPassword.addEventListener('input', renderRules);
      renderRules();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        UI.clearErrors(form);
        errorBox.hidden = true;
        try {
          await UI.busy(form.querySelector('[type=submit]'), () =>
            Auth.resetPassword(token, form.elements.newPassword.value, form.elements.confirmPassword.value)
          );
          Auth.logout();
          UI.flash('Password changed. Sign in with your new password.');
          location.replace('login.html');
        } catch (err) {
          if (UI.showErrors(form, err)) return;
          errorBox.textContent = err instanceof AppError ? err.message : 'Something went wrong. Please try again.';
          errorBox.hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
